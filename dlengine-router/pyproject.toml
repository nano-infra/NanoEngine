[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "dlengine-router"
version = "0.1.0"
description = "DLEngine OpenAI-compatible inference router"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepLink-MLSysResearch" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/nanodeploy-project/nano-deploy"

[tool.maturin]
bindings = "bin"
