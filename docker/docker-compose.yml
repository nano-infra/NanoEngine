version: '3.8'

services:
  valkey:
    image: valkey/valkey:9.0.2-alpine
    container_name: valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    command: valkey-server --appendonly yes
    networks:
      - valkey-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "8001:8001"
    volumes:
      - redisinsight-data:/data
    networks:
      - valkey-network
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      - RI_APP_PORT=8001
      - RITRUSTEDORIGINS=http://localhost:8001,http://127.0.0.1:8001

volumes:
  valkey-data:
    driver: local
  redisinsight-data:
    driver: local

networks:
  valkey-network:
    driver: bridge
