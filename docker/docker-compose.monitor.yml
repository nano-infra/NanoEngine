services:
  dlengine:
    image: ${DLENGINE_IMAGE:-dlengine:0.2.0-cu128-devel}
    container_name: dlengine
    working_dir: /workspace/DLEngine/dlengine
    command:
      - bash
      - -lc
      - >
        python3 -m pip install --break-system-packages --no-build-isolation -e .
        && dlengine serve /models/dlengine
        --host 0.0.0.0
        --port 8104
        $${DLENGINE_SERVE_ARGS:-}
    environment:
      DLENGINE_SERVE_ARGS: ${DLENGINE_SERVE_ARGS:-}
      DLENGINE_LOG_LEVEL: ${DLENGINE_LOG_LEVEL:-INFO}
    ports:
      - "8104:8104"
    volumes:
      - ..:/workspace/DLEngine
      - ${DLENGINE_MODEL_HOST:?set DLENGINE_MODEL_HOST}:/models/dlengine:ro
    ipc: host
    shm_size: 16g
    ulimits:
      memlock: -1
    cap_add:
      - IPC_LOCK
    networks:
      - dlengine-monitor
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  prometheus:
    image: prom/prometheus:latest
    container_name: dlengine-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - dlengine
    networks:
      - dlengine-monitor

  grafana:
    image: grafana/grafana-oss:latest
    container_name: dlengine-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - dlengine-monitor

networks:
  dlengine-monitor:
