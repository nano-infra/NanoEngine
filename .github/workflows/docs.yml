name: Documentation website

on:
  pull_request:
    branches:
      - Pure_dp
    paths:
      - "README.md"
      - "docs/site/**"
      - "docs/mkdocs.yml"
      - "docs/requirements.txt"
      - "docs/Makefile"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - Pure_dp
    tags:
      - "v*"
    paths:
      - "README.md"
      - "docs/site/**"
      - "docs/mkdocs.yml"
      - "docs/requirements.txt"
      - "docs/Makefile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: make -C docs build

      - name: Upload private documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlengine-docs-${{ github.sha }}
          path: docs/generated
          if-no-files-found: error
          retention-days: 14
