[package]
name = "dlengine-rust"
version = "0.2.0"
edition = "2021"

[lib]
name = "_dlengine_rust"
path = "rust/_dlengine_rust/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
bincode = "1.3"
pyo3 = { version = "0.23" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
