[package]
name = "dlengine-rust"
version = "0.2.0"
edition = "2021"

[lib]
name = "_dlengine_rust"
path = "rust/_dlengine_rust/src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
bincode = "1.3"
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
