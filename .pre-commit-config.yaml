repos:
  - repo: https://github.com/omnilib/ufmt
    rev: v2.9.0
    hooks:
      - id: ufmt
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: check-merge-conflict
      - id: fix-encoding-pragma
        args: ["--remove"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.9
    hooks:
      - id: mdformat
        args: ["--number"]
        additional_dependencies:
          - mdformat-openmmlab
          - mdformat_frontmatter
          - linkify-it-py

  - repo: https://github.com/codespell-project/codespell
    rev: v2.1.0
    hooks:
      - id: codespell
        args: ["-L", "CANN,cann,crate"]
        exclude: >
          (?x)^(
              .*/docs/imgs/.*|
              .*/json\.hpp|
              .*/pybind_json\.hpp
          )$

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
      # Run cargo check per package. NanoDeploy uses scripts/cargo-check-with-protoc.sh (auto-finds scripts/.bin/protoc)
      - id: cargo-check
        name: cargo check (NanoDeploy)
        entry: bash -c 'B="$(pwd)/scripts/.bin"; [[ -d "$B" ]] && export PATH="$B:$PATH"; [[ -x "$B/protoc" ]] && export PROTOC="$B/protoc"; exec cargo check'
        args: ["--manifest-path", "NanoDeploy/server/Cargo.toml"]
        files: ^NanoDeploy/
        language: system
        pass_filenames: false
      - id: cargo-check
        args: ["--manifest-path", "Spoke/spoke-rust/Cargo.toml"]
        files: ^Spoke/
      - id: clippy
        name: clippy (NanoDeploy)
        entry: bash -c 'B="$(pwd)/scripts/.bin"; [[ -d "$B" ]] && export PATH="$B:$PATH"; [[ -x "$B/protoc" ]] && export PROTOC="$B/protoc"; exec cargo clippy'
        args: ["--manifest-path", "NanoDeploy/server/Cargo.toml", "--", "-D", "warnings"]
        files: ^NanoDeploy/
        language: system
        pass_filenames: false
      - id: clippy
        args: ["--manifest-path", "Spoke/spoke-rust/Cargo.toml", "--", "-D", "warnings"]
        files: ^Spoke/
      # DLSlime nanoctrl (standalone, no protoc)
      - id: cargo-check
        args: ["--manifest-path", "DLSlime/nanoctrl-rust/Cargo.toml"]
        files: ^DLSlime/nanoctrl-rust/
      - id: clippy
        args: ["--manifest-path", "DLSlime/nanoctrl-rust/Cargo.toml", "--", "-D", "warnings"]
        files: ^DLSlime/nanoctrl-rust/

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.6
    hooks:
      - id: clang-format
        args: ["--style=file"]
        files: \.(cpp|hpp|c|h|cu|cuh)$
        exclude: '(?i).*(json|jring|dlpack|gloo|ibgda_device\.cuh).*'

