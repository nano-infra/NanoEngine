[package]
name = "nanodeploy-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime
tokio = { version = "1.36", features = ["full"] }

# Web Framework
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = "0.14"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI Args
clap = { version = "4.5", features = ["derive"] }

# IPC & Utils
bytes = "1.5"
tokio-util = { version = "0.7", features = ["codec"] }
dashmap = "5.5"
flatbuffers = "2.1"

# Tokenizers
# Tokenizers
tokenizers = { version = "0.21", features = ["onig"] }

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Async Utilities
futures = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
minijinja = { version = "1.0", features = ["json", "loader"] }

# Spoke Rust Wrapper
spoke = { path = "../../Spoke/spoke-rust" }

# Etcd
etcd-client = "0.12"

[dev-dependencies]
tempfile = "3.10"
