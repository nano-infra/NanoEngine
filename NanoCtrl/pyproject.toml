[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoctrl"
version = "0.0.6"
description = "Declarative Control plane of LLM Inference."
requires-python = ">=3.10"
dependencies = ["httpx>=0.24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nanoctrl*"]
