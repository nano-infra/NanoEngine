[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoinfra"
version = "0.1.0"
description = "NanoInfra monorepo meta-package"
authors = [{ name = "DeepLink-MLSysResearch" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

# Install individual components:
#   pip install ".[nanodeploy]"
#   pip install ".[nanodeployvl]"   # Vision-Language support (nanodeploy.vl subpackage)
#   pip install ".[all]"
[project.optional-dependencies]
# Standalone GPU kernels. nanodeploy depends on this; the file: URL resolves
# the local monorepo path.
nanodeploy-kernel = [
    "nanodeploy-kernel @ file:nanodeploy-kernel",
]
nanodeploy = [
    "nanodeploy-kernel @ file:nanodeploy-kernel",
    "nanodeploy @ file:nanodeploy",
]
# NanoDeployVL was folded into nanodeploy as the `nanodeploy.vl` subpackage.
# This extra now just pulls nanodeploy with its optional VL dependencies.
nanodeployvl = [
    "nanodeploy-kernel @ file:nanodeploy-kernel",
    "nanodeploy[vl] @ file:nanodeploy",
]
all = [
    "nanodeploy-kernel @ file:nanodeploy-kernel",
    "nanodeploy[vl] @ file:nanodeploy",
]

[tool.setuptools]
# No Python packages to install from the root itself
py-modules = []
