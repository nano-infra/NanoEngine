[build-system]
requires = ["setuptools>=60"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoinfra"
version = "0.1.0"
description = "NanoInfra monorepo meta-package"
authors = [{ name = "DeepLink-MLSysResearch" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

# Install individual components:
#   pip install ".[dlengine]"
#   pip install ".[dlenginevl]"   # Vision-Language support (dlengine.vl subpackage)
#   pip install ".[all]"
#
# The optional-dependencies are generated dynamically in setup.py so the
# local monorepo subpackages can be referenced via *absolute* `file://` URLs.
# Relative PEP 508 direct references (e.g. `file:dlengine`) are
# rejected by modern `packaging` (>=24) with "Invalid URL given".
dynamic = ["optional-dependencies"]

[tool.setuptools]
# No Python packages to install from the root itself
py-modules = []
